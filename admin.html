<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MFH Admin Panel</title>

<style>
body{
  margin:0;
  background:#0b0b0b;
  color:#eee;
  font-family:Arial,sans-serif;
  padding:18px
}

.wrap{
  max-width:1100px;
  margin:auto
}

.gold{
  color:#d4af37
}

.box{
  background:#141414;
  border:1px solid #333;
  border-radius:14px;
  padding:18px;
  margin:14px 0
}

input,select,button{
  box-sizing:border-box;
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #555;
  background:#0d0d0d;
  color:#fff;
  margin:6px 0
}

button{
  background:#d4af37;
  color:#111;
  font-weight:700;
  cursor:pointer
}

button:hover{
  opacity:.9
}

.btns{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:10px
}

.btns button{
  margin:0;
  font-size:12px
}

.danger{
  background:#9b3333;
  color:#fff
}

.order{
  border:1px solid #333;
  border-radius:12px;
  padding:14px;
  margin:12px 0;
  line-height:1.7
}

.muted{
  color:#aaa;
  font-size:13px
}

.status{
  font-weight:bold;
  margin-top:5px
}

.new{
  color:#f0c94b
}

.confirmed{
  color:#61d37a
}

.shipped{
  color:#65b7ff
}

.delivered{
  color:#76e39a
}

.error{
  color:#ff7777
}

.success{
  color:#71e08a
}

.loading{
  color:#d4af37;
  padding:15px 0
}

.topbar{
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap
}

.logout{
  width:auto;
  background:#9b3333;
  color:white
}

.refresh{
  width:auto
}

@media(max-width:650px){
  .btns{
    grid-template-columns:1fr 1fr
  }
}
</style>
</head>

<body>

<div class="wrap">

<h1>
  MFH <span class="gold">Admin Panel</span>
</h1>

<!-- LOGIN -->
<div class="box" id="loginBox">

  <h3>🔐 Admin Login</h3>

  <input
    id="adminEmail"
    type="email"
    placeholder="Admin email"
  >

  <input
    id="adminPassword"
    type="password"
    placeholder="Password"
  >

  <button onclick="adminLogin()">
    🔐 Login
  </button>

  <div id="loginResult" class="muted"></div>

</div>


<!-- ADMIN PANEL -->
<div id="panel" style="display:none">

  <div class="box">

    <div class="topbar">

      <h2 style="margin:0">
        📦 Orders
      </h2>

      <div>
        <button
          class="refresh"
          onclick="loadOrders()">
          🔄 Refresh
        </button>

        <button
          class="logout"
          onclick="adminLogout()">
          Logout
        </button>
      </div>

    </div>


    <select
      id="filter"
      onchange="renderOrders()">

      <option value="all">
        All Orders
      </option>

      <option value="New">
        New
      </option>

      <option value="Confirmed">
        Confirmed
      </option>

      <option value="Shipped">
        Shipped
      </option>

      <option value="Delivered">
        Delivered
      </option>

    </select>


    <div id="orders">
      Loading...
    </div>

  </div>

</div>

</div>


<script type="module">

/* =========================================
   FIREBASE IMPORT
========================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBQkq82HDMjndAPnvJ-jYw64L3J55tFCHk",

  authDomain:
    "mens-fashion-hub-e2773.firebaseapp.com",

  projectId:
    "mens-fashion-hub-e2773",

  storageBucket:
    "mens-fashion-hub-e2773.firebasestorage.app",

  messagingSenderId:
    "309752221606",

  appId:
    "1:309752221606:web:f285e8ff080c9cd45f8967",

  measurementId:
    "G-C9YM24BR7J"
};


/* =========================================
   FIREBASE START
========================================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

let orders = [];


/* =========================================
   DEBUG
========================================= */

console.log(
  "MFH Firebase Project:",
  firebaseConfig.projectId
);

console.log(
  "MFH Firebase API key loaded:",
  firebaseConfig.apiKey
);


/* =========================================
   ADMIN LOGIN
========================================= */

window.adminLogin =
async function(){

  const email =
    document
    .getElementById("adminEmail")
    .value
    .trim();

  const password =
    document
    .getElementById("adminPassword")
    .value;

  const result =
    document
    .getElementById("loginResult");


  if(!email || !password){

    result.className = "error";

    result.textContent =
      "❌ Email aur password dalo.";

    return;
  }


  result.className = "muted";

  result.textContent =
    "⏳ Login ho raha hai...";


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    result.className =
      "success";

    result.textContent =
      "✅ Login successful.";

  }

  catch(error){

    console.error(
      "ADMIN LOGIN ERROR:",
      error
    );

    result.className =
      "error";

    result.textContent =
      "❌ Login failed: " +
      error.message;

  }

};


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
  auth,
  function(user){

    const loginBox =
      document.getElementById(
        "loginBox"
      );

    const panel =
      document.getElementById(
        "panel"
      );


    if(user){

      loginBox.innerHTML = `

        <div style="display:flex;
                    justify-content:space-between;
                    align-items:center;
                    gap:10px;
                    flex-wrap:wrap">

          <div>

            <b>✅ Admin logged in</b>

            <br>

            <span class="muted">
              ${esc(user.email || "")}
            </span>

          </div>

          <button
            class="logout"
            style="width:auto"
            onclick="adminLogout()">

            Logout

          </button>

        </div>
      `;


      panel.style.display =
        "block";


      loadOrders();

    }

    else{

      panel.style.display =
        "none";

    }

  }
);


/* =========================================
   LOGOUT
========================================= */

window.adminLogout =
async function(){

  try{

    await signOut(auth);

    location.reload();

  }

  catch(error){

    console.error(error);

    alert(
      "Logout failed: " +
      error.message
    );

  }

};


/* =========================================
   LOAD ORDERS
========================================= */

window.loadOrders =
async function(){

  const box =
    document.getElementById(
      "orders"
    );

  box.innerHTML =
    '<div class="loading">⏳ Orders loading...</div>';


  try{

    const snap =
      await getDocs(
        collection(
          db,
          "orders"
        )
      );


    orders =
      snap.docs.map(
        function(d){

          return {
            id:d.id,
            ...d.data()
          };

        }
      );


    /* newest first */

    orders.sort(
      function(a,b){

        const aa =
          a.createdAt?.seconds || 0;

        const bb =
          b.createdAt?.seconds || 0;

        return bb - aa;

      }
    );


    renderOrders();

  }

  catch(error){

    console.error(
      "LOAD ORDERS ERROR:",
      error
    );

    box.innerHTML = `

      <div class="error">

        ❌ Orders load nahi hue.

        <br><br>

        ${esc(error.message)}

      </div>

    `;

  }

};


/* =========================================
   RENDER ORDERS
========================================= */

window.renderOrders =
function(){

  const box =
    document.getElementById(
      "orders"
    );

  const filter =
    document.getElementById(
      "filter"
    ).value;


  const list =
    orders.filter(
      function(order){

        const status =
          order.status || "New";

        return (
          filter === "all" ||
          status === filter
        );

      }
    );


  if(!list.length){

    box.innerHTML = `

      <div class="muted">

        📦 No orders found.

      </div>

    `;

    return;

  }


  box.innerHTML =
    list.map(
      function(order){

        const status =
          order.status || "New";

        const statusClass =
          status.toLowerCase();


        let itemsHTML = "";


        if(
          Array.isArray(
            order.items
          )
        ){

          itemsHTML =
            order.items
            .map(
              function(item){

                return `

                  ${esc(
                    item.name ||
                    "Product"
                  )}

                  ×

                  ${Number(
                    item.qty || 1
                  )}

                  ${
                    item.size
                    ? "(" +
                      esc(item.size) +
                      ")"
                    : ""
                  }

                  <br>

                `;

              }
            )
            .join("");

        }


        return `

          <div class="order">

            <div>
              <b>Order ID:</b>

              <span class="gold">
                ${esc(
                  order.orderId ||
                  order.id
                )}
              </span>
            </div>


            <div>
              <b>Customer ID:</b>
              ${esc(
                order.customerId ||
                order.customerUid ||
                "-"
              )}
            </div>


            <div>
              <b>Name:</b>
              ${esc(
                order.customerName ||
                "-"
              )}
            </div>


            <div>
              <b>Mobile:</b>
              ${esc(
                order.mobile ||
                "-"
              )}
            </div>


            <div>
              <b>Email:</b>
              ${esc(
                order.email ||
                "-"
              )}
            </div>


            <div>
              <b>Address:</b>
              ${esc(
                order.address ||
                "-"
              )}

              -

              ${esc(
                order.pincode ||
                ""
              )}
            </div>


            <div>
              <b>Items:</b>
              <br>

              ${itemsHTML || "-"}

            </div>


            <div>
              <b>Total:</b>

              ₹${Number(
                order.total || 0
              ).toLocaleString(
                "en-IN"
              )}

            </div>


            <div
              class="status ${statusClass}">

              <b>Current Status:</b>

              ${esc(status)}

            </div>


            <div class="btns">

              <button
                onclick="setStatus(
                  '${escJS(order.id)}',
                  'Confirmed'
                )">

                ✅ Confirm

              </button>


              <button
                onclick="setStatus(
                  '${escJS(order.id)}',
                  'Shipped'
                )">

                🚚 Shipped

              </button>


              <button
                onclick="setStatus(
                  '${escJS(order.id)}',
                  'Delivered'
                )">

                ✅ Delivered

              </button>


              <button
                class="danger"
                onclick="setStatus(
                  '${escJS(order.id)}',
                  'New'
                )">

                ↩ Reset New

              </button>

            </div>

          </div>

        `;

      }
    )
    .join("");

};


/* =========================================
   CHANGE ORDER STATUS
========================================= */

window.setStatus =
async function(
  id,
  status
){

  try{

    await updateDoc(

      doc(
        db,
        "orders",
        id
      ),

      {
        status: status,
        adminUpdatedAt:
          new Date()
      }

    );


    await loadOrders();


  }

  catch(error){

    console.error(
      "STATUS UPDATE ERROR:",
      error
    );

    alert(
      "❌ Status update failed:\n" +
      error.message
    );

  }

};


/* =========================================
   HTML ESCAPE
========================================= */

function esc(value){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>'"]/g,
    function(char){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "'":"&#39;",
        '"':"&quot;"

      }[char];

    }
  );

}


/* =========================================
   JAVASCRIPT STRING ESCAPE
========================================= */

function escJS(value){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MFH Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .login-box,
    .admin-panel {
      max-width: 600px;
      margin: 50px auto;
      background: #181b22;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    h1, h2 {
      margin-top: 0;
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
    }

    input,
    select {
      background: #252933;
      color: #fff;
      outline: none;
    }

    button {
      background: #fff;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .logout {
      background: #dc3545;
      color: #fff;
      max-width: 120px;
      float: right;
      margin-top: -45px;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background: #252933;
      display: none;
    }

    .orders {
      margin-top: 25px;
    }

    .order {
      background: #20232b;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .order p {
      margin: 7px 0;
      word-break: break-word;
    }

    .order strong {
      color: #fff;
    }

    .status {
      margin-top: 12px;
    }

    .status button {
      width: auto;
      padding: 9px 14px;
      margin-right: 5px;
      background: #333844;
      color: #fff;
    }

    .status button.active {
      background: #fff;
      color: #111;
    }

    .filter {
      margin-bottom: 20px;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #aaa;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      .login-box,
      .admin-panel {
        margin: 25px auto;
        padding: 18px;
      }

      .logout {
        float: none;
        max-width: 100%;
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginSection" class="container">
    <div class="login-box">

      <div class="logo">
        MEN'S FASHION HUB
      </div>

      <h2>Admin Login</h2>

      <input
        type="email"
        id="email"
        placeholder="Admin Email"
        autocomplete="email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button id="loginBtn">
        Login
      </button>

      <div id="loginMessage" class="message"></div>

    </div>
  </div>


  <!-- ADMIN PANEL -->
  <div id="adminSection" class="container hidden">

    <div class="admin-panel">

      <h1>MFH Admin Panel</h1>

      <button id="logoutBtn" class="logout">
        Logout
      </button>

      <div style="clear:both;"></div>

      <div class="filter">
        <select id="statusFilter">
          <option value="all">All Orders</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <div id="orders" class="orders">
        <div class="loading">
          Loading orders...
        </div>
      </div>

    </div>
  </div>


  <!-- FIREBASE -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    // ==========================================
    // FIREBASE CONFIG
    // ==========================================

    const firebaseConfig = {
      apiKey: "AIzaSyBQkq82HDMjndAPnvJ-jyW64L3J55tFCHk",
      authDomain: "mens-fashion-hub-e2773.firebaseapp.com",
      projectId: "mens-fashion-hub-e2773",
      storageBucket: "mens-fashion-hub-e2773.firebasestorage.app",
      messagingSenderId: "309752221606",
      appId: "1:309752221606:web:f285e8ff080c9cd45f8967",
      measurementId: "G-C9YM24BR7J"
    };


    // ==========================================
    // FIREBASE INITIALIZE
    // ==========================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // ==========================================
    // ELEMENTS
    // ==========================================

    const loginSection =
      document.getElementById("loginSection");

    const adminSection =
      document.getElementById("adminSection");

    const loginBtn =
      document.getElementById("loginBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginMessage =
      document.getElementById("loginMessage");

    const ordersContainer =
      document.getElementById("orders");

    const statusFilter =
      document.getElementById("statusFilter");


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(message) {

      loginMessage.style.display = "block";

      loginMessage.textContent = message;
    }


    // ==========================================
    // LOGIN
    // ==========================================

    loginBtn.addEventListener("click", async () => {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      if (!email || !password) {

        showMessage(
          "Email aur password enter karo."
        );

        return;
      }

      loginBtn.disabled = true;

      loginBtn.textContent = "Logging in...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        showMessage("Login successful.");

      } catch (error) {

        console.error("Firebase Login Error:", error);

        showMessage(
          "Login failed: " +
          (error.message || error.code)
        );

      } finally {

        loginBtn.disabled = false;

        loginBtn.textContent = "Login";
      }

    });


    // ==========================================
    // LOGOUT
    // ==========================================

    logoutBtn.addEventListener("click", async () => {

      try {

        await signOut(auth);

      } catch (error) {

        console.error(error);

      }

    });


    // ==========================================
    // AUTH STATE
    // ==========================================

    onAuthStateChanged(auth, async (user) => {

      if (user) {

        loginSection.classList.add("hidden");

        adminSection.classList.remove("hidden");

        await loadOrders();

      } else {

        adminSection.classList.add("hidden");

        loginSection.classList.remove("hidden");

        ordersContainer.innerHTML = "";

      }

    });


    // ==========================================
    // LOAD ORDERS
    // ==========================================

    async function loadOrders() {

      ordersContainer.innerHTML =
        '<div class="loading">Loading orders...</div>';

      try {

        const snapshot =
          await getDocs(
            collection(db, "orders")
          );

        const orders = [];

        snapshot.forEach((item) => {

          orders.push({
            id: item.id,
            ...item.data()
          });

        });

        window.allOrders = orders;

        renderOrders();

      } catch (error) {

        console.error(
          "Firestore Error:",
          error
        );

        ordersContainer.innerHTML =
          `<div class="message" style="display:block;">
            Orders load nahi ho paaye.<br><br>
            ${escapeHtml(error.message)}
          </div>`;
      }

    }


    // ==========================================
    // RENDER ORDERS
    // ==========================================

    function renderOrders() {

      const filter =
        statusFilter.value;

      let orders =
        window.allOrders || [];

      if (filter !== "all") {

        orders =
          orders.filter(
            order =>
              String(order.status || "pending")
                .toLowerCase() === filter
          );

      }

      if (orders.length === 0) {

        ordersContainer.innerHTML =
          '<div class="loading">No orders found.</div>';

        return;
      }

      ordersContainer.innerHTML = "";

      orders.forEach(order => {

        const orderDiv =
          document.createElement("div");

        orderDiv.className = "order";

        const status =
          String(
            order.status || "pending"
          ).toLowerCase();

        orderDiv.innerHTML = `

          <p>
            <strong>Order ID:</strong>
            ${escapeHtml(order.id)}
          </p>

          <p>
            <strong>Name:</strong>
            ${escapeHtml(
              order.name ||
              order.customerName ||
              "-"
            )}
          </p>

          <p>
            <strong>Email:</strong>
            ${escapeHtml(
              order.email || "-"
            )}
          </p>

          <p>
            <strong>Phone:</strong>
            ${escapeHtml(
              order.phone || "-"
            )}
          </p>

          <p>
            <strong>Product:</strong>
            ${escapeHtml(
              order.product ||
              order.productName ||
              "-"
            )}
          </p>

          <p>
            <strong>Quantity:</strong>
            ${escapeHtml(
              order.quantity ||
              "-"
            )}
          </p>

          <p>
            <strong>Address:</strong>
            ${escapeHtml(
              order.address || "-"
            )}
          </p>

          <p>
            <strong>Status:</strong>
            ${escapeHtml(status)}
          </p>

          <div class="status">

            <button
              data-id="${escapeHtml(order.id)}"
              data-status="pending"
              class="${status === "pending" ? "active" : ""}">
              Pending
            </button>

            <button
              data-id="${escapeHtml(order.id)}"
              data-status="confirmed"
              class="${status === "confirmed" ? "active" : ""}">
              Confirmed
            </button>

            <button
              data-id="${escapeHtml(order.id)}"
              data-status="shipped"
              class="${status === "shipped" ? "active" : ""}">
              Shipped
            </button>

            <button
              data-id="${escapeHtml(order.id)}"
              data-status="delivered"
              class="${status === "delivered" ? "active" : ""}">
              Delivered
            </button>

            <button
              data-id="${escapeHtml(order.id)}"
              data-status="cancelled"
              class="${status === "cancelled" ? "active" : ""}">
              Cancelled
            </button>

          </div>
        `;

        ordersContainer.appendChild(orderDiv);

      });

      // STATUS BUTTONS

      document
        .querySelectorAll(".status button")
        .forEach(button => {

          button.addEventListener(
            "click",
            async () => {

              const id =
                button.dataset.id;

              const newStatus =
                button.dataset.status;

              await updateOrderStatus(
                id,
                newStatus
              );

            }
          );

        });

    }


    // ==========================================
    // UPDATE ORDER STATUS
    // ==========================================

    async function updateOrderStatus(
      orderId,
      newStatus
    ) {

      try {

        await updateDoc(
          doc(
            db,
            "orders",
            orderId
          ),
          {
            status: newStatus
          }
        );

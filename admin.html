<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MFH Admin Panel</title>

<style>
body{
  margin:0;
  background:#0b0b0b;
  color:#eee;
  font-family:Arial,sans-serif;
  padding:18px;
}

.wrap{
  max-width:1100px;
  margin:auto;
}

.gold{
  color:#d4af37;
}

.box{
  background:#141414;
  border:1px solid #333;
  border-radius:14px;
  padding:18px;
  margin:14px 0;
}

input,select,button{
  box-sizing:border-box;
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #555;
  background:#0d0d0d;
  color:#fff;
  margin:6px 0;
}

button{
  background:#d4af37;
  color:#111;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.btns{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:10px;
}

.btns button{
  margin:0;
  font-size:12px;
}

.danger{
  background:#9b3333;
  color:#fff;
}

.order{
  border:1px solid #333;
  border-radius:12px;
  padding:14px;
  margin:12px 0;
}

.order div{
  margin:5px 0;
}

.muted{
  color:#aaa;
  font-size:13px;
}

.status{
  font-weight:bold;
  margin-top:8px;
}

.new{
  color:#f0c94b;
}

.confirmed{
  color:#61d37a;
}

.shipped{
  color:#65b7ff;
}

.delivered{
  color:#76e39a;
}

.error{
  color:#ff7777;
}

.success{
  color:#71e08a;
}

.loading{
  color:#aaa;
  padding:15px 0;
}

.logout-btn{
  width:auto;
  float:right;
  margin:0;
}

@media(max-width:650px){
  .btns{
    grid-template-columns:1fr 1fr;
  }

  .logout-btn{
    float:none;
    width:auto;
    margin-top:10px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<h1>
  MFH <span class="gold">Admin Panel</span>
</h1>


<!-- ================= LOGIN ================= -->

<div class="box" id="loginBox">

  <h3>Admin Login</h3>

  <input
    id="adminEmail"
    type="email"
    placeholder="Admin email"
    autocomplete="email"
  >

  <input
    id="adminPassword"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button id="loginBtn">
    🔐 Login
  </button>

  <div id="loginResult" class="muted"></div>

</div>


<!-- ================= ADMIN PANEL ================= -->

<div id="panel" style="display:none">

  <div class="box">

    <div style="
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    ">

      <h2 style="margin:0">
        Orders
      </h2>

      <button
        id="refreshBtn"
        style="width:auto"
      >
        🔄 Refresh
      </button>

    </div>


    <select id="filter">

      <option value="all">
        All Orders
      </option>

      <option value="New">
        New
      </option>

      <option value="Confirmed">
        Confirmed
      </option>

      <option value="Shipped">
        Shipped
      </option>

      <option value="Delivered">
        Delivered
      </option>

    </select>


    <div id="orders">
      <div class="loading">
        Login ke baad orders load honge...
      </div>
    </div>

  </div>

</div>

</div>


<!-- ================= FIREBASE ================= -->

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



/* =========================================
   NEW FIREBASE WEB APP CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBQkq82HDMjndAPnvJ-yw64L3J55tFCHk",

  authDomain:
    "mens-fashion-hub-e2773.firebaseapp.com",

  projectId:
    "mens-fashion-hub-e2773",

  storageBucket:
    "mens-fashion-hub-e2773.firebasestorage.app",

  messagingSenderId:
    "309752221606",

  appId:
    "1:309752221606:web:f285e8ff080c9cd45f8967",

  measurementId:
    "G-C9YM24BR7J"
};



/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

let orders = [];



/* =========================================
   LOGIN
========================================= */

document
  .getElementById("loginBtn")
  .addEventListener(
    "click",
    adminLogin
  );


async function adminLogin(){

  const email =
    document
      .getElementById("adminEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("adminPassword")
      .value;

  const result =
    document
      .getElementById("loginResult");

  const loginButton =
    document
      .getElementById("loginBtn");


  if(!email || !password){

    result.className =
      "error";

    result.textContent =
      "Email aur password dalo.";

    return;
  }


  loginButton.disabled = true;

  loginButton.textContent =
    "⏳ Login ho raha hai...";

  result.className =
    "muted";

  result.textContent =
    "Firebase authentication check ho rahi hai...";


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    result.className =
      "success";

    result.textContent =
      "✅ Login successful.";

  }

  catch(error){

    console.error(
      "Firebase Login Error:",
      error
    );

    result.className =
      "error";

    result.textContent =
      "Login failed: " +
      error.message;
  }

  finally{

    loginButton.disabled =
      false;

    loginButton.textContent =
      "🔐 Login";
  }
}



/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
  auth,
  async (user) => {

    if(user){

      document
        .getElementById("loginBox")
        .innerHTML = `

          <b>✅ Admin logged in:</b>
          ${esc(user.email || "")}

          <button
            id="logoutBtn"
            class="logout-btn"
          >
            Logout
          </button>

          <div style="clear:both"></div>
        `;


      document
        .getElementById("panel")
        .style.display =
          "block";


      document
        .getElementById("logoutBtn")
        .addEventListener(
          "click",
          adminLogout
        );


      await loadOrders();

    }

    else{

      document
        .getElementById("panel")
        .style.display =
          "none";
    }

  }
);



/* =========================================
   LOGOUT
========================================= */

async function adminLogout(){

  try{

    await signOut(auth);

    location.reload();

  }

  catch(error){

    console.error(
      "Logout Error:",
      error
    );

  }
}



/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders(){

  const box =
    document
      .getElementById("orders");


  box.innerHTML =
    `
    <div class="loading">
      🔄 Orders load ho rahe hain...
    </div>
    `;


  try{

    const snap =
      await getDocs(
        collection(
          db,
          "orders"
        )
      );


    orders =
      snap.docs.map(
        d => ({
          id:d.id,
          ...d.data()
        })
      );


    orders.sort(
      (a,b) => {

        const aa =
          a.createdAt?.seconds || 0;

        const bb =
          b.createdAt?.seconds || 0;

        return bb - aa;
      }
    );


    renderOrders();

  }

  catch(error){

    console.error(
      "Orders Load Error:",
      error
    );


    box.innerHTML =
      `
      <div class="error">

        ❌ Orders load nahi hue.

        <br><br>

        ${esc(error.message)}

      </div>
      `;
  }
}



/* =========================================
   RENDER ORDERS
========================================= */

function renderOrders(){

  const box =
    document
      .getElementById("orders");


  const filter =
    document
      .getElementById("filter")
      .value;


  const list =
    orders.filter(
      order => {

        const status =
          order.status || "New";

        return (
          filter === "all" ||
          status === filter
        );

      }
    );


  if(!list.length){

    box.innerHTML =
      `
      <div class="muted">
        No orders found.
      </div>
      `;

    return;
  }


  box.innerHTML =
    list
      .map(order => {

        const status =
          order.status || "New";


        const statusClass =
          status.toLowerCase();


        const items =
          Array.isArray(order.items)

          ?

          order.items
            .map(item => `

              ${esc(
                item.name ||
                "Product"
              )}

              ×

              ${Number(
                item.qty || 1
              )}

              (

              ${esc(
                item.size ||
                "FREE"
              )}

              )

            `)
            .join("<br>")

          :

          "";



        return `

          <div class="order">

            <div>
              <b>Order ID:</b>

              <span class="gold">
                ${esc(
                  order.orderId ||
                  order.id
                )}
              </span>
            </div>


            <div>
              <b>Customer ID:</b>
              ${esc(
                order.customerId ||
                order.customerUid ||
                "-"
              )}
            </div>


            <div>
              <b>Name:</b>
              ${esc(
                order.customerName ||
                "-"
              )}
            </div>


            <div>
              <b>Mobile:</b>
              ${esc(
                order.mobile ||
                "-"
              )}
            </div>


            <div>
              <b>Email:</b>
              ${esc(
                order.email ||
                "-"
              )}
            </div>


            <div>
              <b>Address:</b>
              ${esc(
                order.address ||
                "-"
              )}

              -

              ${esc(
                order.pincode ||
                ""
              )}
            </div>


            <div>
              <b>Items:</b>
              <br>

              ${items}
            </div>


            <div>
              <b>Total:</b>

              ₹${Number(
                order.total ||
                0
              ).toLocaleString(
                "en-IN"
              )}
            </div>


            <div
              class="status ${statusClass}"
            >
              <b>Status:</b>

              ${esc(status)}
            </div>


            <div class="btns">

              <button
                onclick="setStatus(
                  '${esc(order.id)}',
                  'Confirmed'
                )"
              >
                Confirm
              </button>


              <button
                onclick="setStatus(
                  '${esc(order.id)}',
                  'Shipped'
                )"
              >
                Shipped
              </button>


              <button
                onclick="setStatus(
                  '${esc(order.id)}',
                  'Delivered'
                )"
              >
                Delivered
              </button>


              <button
                class="danger"
                onclick="setStatus(
                  '${esc(order.id)}',
                  'New'
                )"
              >
                Reset New
              </button>

            </div>

          </div>

        `;

      })
      .join("");
}



/* =========================================
   UPDATE ORDER STATUS
========================================= */

window.setStatus =
  async function(
    id,
    status
  ){

    try{

      await updateDoc(
        doc(
          db,
          "orders",
          id
        ),
        {
          status:status,
          adminUpdatedAt:new Date()
        }
      );


      await loadOrders();

    }

    catch(error){

      console.error(
        "Status Update Error:",
        error
      );


      alert(
        "Status update failed: " +
        error.message
      );
    }
  };



/* =========================================
   REFRESH
========================================= */

document
  .getElementById("refreshBtn")
  .addEventListener(
    "click",
    loadOrders
  );



/* =========================================
   FILTER
========================================= */

document
  .getElementById("filter")
  .addEventListener(
    "change",
    renderOrders
  );



/* =========================================
   HTML ESCAPE
========================================= */

function esc(value){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>'"]/g,
    character => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "'":"&#39;",
      '"':"&quot;"

    }[character])
  );
}

</script>

</body>
</html>

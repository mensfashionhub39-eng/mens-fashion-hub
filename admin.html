<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MFH Admin Panel</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}main{max-width:1000px;margin:auto;padding:25px 6%}.box{background:#151515;border:1px solid #333;border-radius:16px;padding:20px;margin:18px 0}input{width:100%;box-sizing:border-box;background:#0e0e0e;color:#fff;border:1px solid #444;border-radius:9px;padding:12px;margin:7px 0}.btn{border:0;border-radius:9px;padding:12px 18px;background:#e0b52e;color:#111;font-weight:800;cursor:pointer;margin:5px}.hidden{display:none}.error{color:#ff7777;white-space:pre-wrap}.success{color:#7ee787}</style></head><body><main><div id="login" class="box"><h1>MEN'S FASHION HUB</h1><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="btn" id="loginBtn" type="button">Login</button><p id="loginMsg"></p></div><div id="panel" class="box hidden"><h2>Admin Panel</h2><button class="btn" id="logoutBtn">Logout</button><p>Login successful. Admin panel is working.</p><div id="orders"></div></div></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";import{getFirestore,collection,getDocs,updateDoc,doc,query,orderBy}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBqQ8DHiNjdApnvj-yW64L3J55tFChk",authDomain:"mens-fashion-hub-e2773.firebaseapp.com",projectId:"mens-fashion-hub-e2773",storageBucket:"mens-fashion-hub-e2773.firebasestorage.app",messagingSenderId:"309752221606",appId:"1:309752221606:web:9c2d5ff5a64d9f25e5f8967"};const ADMIN_EMAIL="mensfashionhub39@gmail.com";const $=id=>document.getElementById(id);let auth,db;
try{const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);$("loginBtn").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value;const m=$("loginMsg");if(!email||!password){m.className="error";m.textContent="Email aur password dono bhariye.";return}$("loginBtn").disabled=true;$("loginBtn").textContent="Logging in...";try{await signInWithEmailAndPassword(auth,email,password)}catch(e){console.error(e);m.className="error";m.textContent="Login failed: "+e.code+"\n"+e.message;$("loginBtn").disabled=false;$("loginBtn").textContent="Login"}};$("logoutBtn").onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{if(u&&(u.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase()){$("login").classList.add("hidden");$("panel").classList.remove("hidden");loadOrders()}else if(u){$("loginMsg").className="error";$("loginMsg").textContent="This account is not authorized as the store admin."}})}catch(e){$("loginMsg").className="error";$("loginMsg").textContent="Firebase error: "+e.message}
async function loadOrders(){try{const s=await getDocs(query(collection(db,"orders"),orderBy("createdAt","desc")));$("orders").innerHTML=s.docs.map(d=>{const o=d.data();return `<div style="border-top:1px solid #333;padding:15px">${o.name||"Customer"} • ${o.mobile||""}<br>Total ₹${o.total||0}<br>Status: <b>${o.status||"New"}</b><br><button class="btn" onclick="statusOrder('${d.id}','Confirmed')">Confirmed</button><button class="btn" onclick="statusOrder('${d.id}','Shipped')">Shipped</button><button class="btn" onclick="statusOrder('${d.id}','Delivered')">Delivered</button></div>`}).join("")||"No orders yet."}catch(e){$("orders").textContent="Orders load failed: "+e.message}}
window.statusOrder=async(id,status)=>{try{await updateDoc(doc(db,"orders",id),{status});await loadOrders()}catch(e){alert("Status update failed: "+e.message)}};
</script></body></html>

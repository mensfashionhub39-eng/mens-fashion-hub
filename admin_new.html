<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEN'S FASHION HUB • Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{padding:18px 6%;border-bottom:1px solid #292929;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#080808;z-index:5}
.gold{color:#e0b52e}
main{max-width:1050px;margin:auto;padding:25px 5%}
.box{background:#151515;border:1px solid #333;border-radius:16px;padding:20px;margin:18px 0}
input,select,textarea{width:100%;background:#0e0e0e;color:#fff;border:1px solid #444;border-radius:9px;padding:12px;margin:7px 0}
.btn{border:0;border-radius:9px;padding:12px 18px;background:#e0b52e;color:#111;font-weight:800;cursor:pointer;margin:5px 4px 5px 0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.danger{background:#a33;color:#fff}
.gray{background:#444;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}
.product{border:1px solid #333;border-radius:12px;padding:12px}
.product img{width:100%;height:180px;object-fit:cover;border-radius:8px;background:#222}
.order{border-top:1px solid #333;padding:16px 0}
.order:first-child{border-top:0}
.status{display:inline-block;padding:5px 9px;border-radius:8px;background:#222;margin:5px 0}
.muted{color:#aaa}
.error{color:#ff7777}
.success{color:#73e09a}
.hidden{display:none}
.small{font-size:13px;color:#aaa;line-height:1.5}
hr{border:0;border-top:1px solid #333;margin:18px 0}
</style>
</head>

<body>
<header>
  <b class="gold">MEN'S FASHION HUB • ADMIN</b>
  <button class="btn danger" id="logoutBtn" style="display:none">Logout</button>
</header>

<main>
  <!-- LOGIN -->
  <section id="login" class="box">
    <h2>Admin Login</h2>
    <input id="email" type="email" autocomplete="username" placeholder="Admin email">
    <input id="password" type="password" autocomplete="current-password" placeholder="Password">
    <button class="btn" id="loginBtn">Login</button>
    <p id="loginMsg" class="muted"></p>
  </section>

  <!-- ADMIN PANEL -->
  <section id="panel" class="hidden">

    <div class="box">
      <h2>Dashboard</h2>
      <p id="welcome" class="success"></p>
      <p class="small">Products aur orders isi panel se manage kar sakte ho.</p>
    </div>

    <!-- PRODUCT FORM -->
    <div class="box">
      <h2>Add / Edit Product</h2>

      <input type="hidden" id="pid">

      <input id="name" placeholder="Product name">
      <input id="category" placeholder="Category (Shirts, Jeans, Shoes, Watches...)">
      <input id="price" type="number" min="0" placeholder="Regular price ₹">
      <input id="salePrice" type="number" min="0" placeholder="Sale price ₹ (optional)">
      <input id="stock" type="number" min="0" placeholder="Stock">
      <input id="image" placeholder="Product image URL">
      <textarea id="desc" rows="4" placeholder="Description"></textarea>

      <button class="btn" id="saveBtn">Save Product</button>
      <button class="btn gray" id="clearBtn">Clear</button>

      <p class="small">
        Abhi product image ke liye public image URL paste karo.
        Firebase Storage upload baad me add kiya ja sakta hai.
      </p>

      <p id="productMsg" class="muted"></p>
    </div>

    <!-- PRODUCTS -->
    <div class="box">
      <h2>Products</h2>
      <div id="products" class="grid">
        <p class="muted">Loading products...</p>
      </div>
    </div>

    <!-- ORDERS -->
    <div class="box">
      <h2>Orders</h2>
      <div id="orders">
        <p class="muted">Loading orders...</p>
      </div>
    </div>

  </section>
</main>

<script type="module">

/* =========================================================
   FIREBASE
   MFH ADMIN WEB APP CONFIG
   ========================================================= */

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBQkq82HDMjndAPnvjJ-yw64L3J55tFCHk",
  authDomain: "mens-fashion-hub-e2773.firebaseapp.com",
  projectId: "mens-fashion-hub-e2773",
  storageBucket: "mens-fashion-hub-e2773.firebasestorage.app",
  messagingSenderId: "309752221606",
  appId: "1:309752221606:web:f285e8ff080c9cd45f8967",
  measurementId: "G-C9YM24BR7J"
};

const ADMIN_EMAIL = "mensfashionhub39@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* =========================================================
   HELPERS
   ========================================================= */

const $ = id => document.getElementById(id);

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[m]));
}

function showError(message){
  $("loginMsg").className = "error";
  $("loginMsg").textContent = message;
}

function showProductMessage(message, ok=false){
  $("productMsg").className = ok ? "success" : "error";
  $("productMsg").textContent = message;
}


/* =========================================================
   LOGIN
   ========================================================= */

$("loginBtn").addEventListener("click", async () => {

  const email = $("email").value.trim();
  const password = $("password").value;

  $("loginMsg").textContent = "";

  if(!email || !password){
    showError("Email aur password dono fill karo.");
    return;
  }

  const btn = $("loginBtn");
  btn.disabled = true;
  btn.textContent = "Logging in...";

  try{

    const credential =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    const user = credential.user;

    if(
      !user.email ||
      user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()
    ){

      await signOut(auth);

      showError(
        "Ye account admin nahi hai. Admin email se login karo."
      );

      return;
    }

    $("loginMsg").className = "success";
    $("loginMsg").textContent = "Login successful.";

  }catch(error){

    console.error("Firebase login error:", error);

    let message = error.message || "Login failed.";

    if(error.code === "auth/invalid-credential"){
      message = "Email ya password galat hai.";
    }

    if(error.code === "auth/invalid-api-key"){
      message =
        "Firebase API key invalid hai. Firebase Console ka MFH admin config check karo.";
    }

    if(error.code === "auth/user-not-found"){
      message = "Ye admin email Firebase Authentication me nahi mila.";
    }

    if(error.code === "auth/wrong-password"){
      message = "Password galat hai.";
    }

    showError("Login failed: " + message);

  }finally{

    btn.disabled = false;
    btn.textContent = "Login";

  }

});


/* =========================================================
   LOGOUT
   ========================================================= */

$("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
});


/* =========================================================
   AUTH STATE
   ========================================================= */

onAuthStateChanged(auth, async user => {

  if(
    user &&
    user.email &&
    user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()
  ){

    $("login").classList.add("hidden");
    $("panel").classList.remove("hidden");
    $("logoutBtn").style.display = "block";

    $("welcome").textContent =
      "Logged in as: " + user.email;

    await loadAll();

  }else{

    $("login").classList.remove("hidden");
    $("panel").classList.add("hidden");
    $("logoutBtn").style.display = "none";

    if(user){

      $("loginMsg").className = "error";
      $("loginMsg").textContent =
        "This account is not authorized as the store admin.";

    }

  }

});


/* =========================================================
   LOAD EVERYTHING
   ========================================================= */

async function loadAll(){

  await loadProducts();
  await loadOrders();

}


/* =========================================================
   PRODUCTS
   ========================================================= */

async function loadProducts(){

  const container = $("products");

  container.innerHTML =
    '<p class="muted">Loading products...</p>';

  try{

    const q =
      query(
        collection(db, "products"),
        orderBy("createdAt", "desc")
      );

    const snapshot =
      await getDocs(q);

    if(snapshot.empty){

      container.innerHTML =
        '<p class="muted">No products yet.</p>';

      return;
    }

    container.innerHTML =
      snapshot.docs.map(docSnap => {

        const p = docSnap.data();

        const price =
          Number(
            p.salePrice ||
            p.price ||
            0
          );

        const stock =
          Number(p.stock || 0);

        return `
          <div class="product">

            <img
              src="${esc(
                p.image ||
                "https://via.placeholder.com/500?text=MFH"
              )}"
              alt="${esc(p.name || "Product")}"
              onerror="this.src='https://via.placeholder.com/500?text=MFH'"
            >

            <h3>${esc(p.name || "Unnamed Product")}</h3>

            <p>
              ${esc(p.category || "Fashion")}
              • ₹${price.toLocaleString("en-IN")}
              • Stock ${stock}
            </p>

            <button
              class="btn"
              onclick='editProduct(${JSON.stringify({
                id: docSnap.id,
                ...p
              }).replace(/'/g,"&#39;")})'
            >
              Edit
            </button>

            <button
              class="btn danger"
              onclick="deleteProduct('${esc(docSnap.id)}')"
            >
              Delete
            </button>

          </div>
        `;

      }).join("");

  }catch(error){

    console.error(error);

    container.innerHTML = `
      <p class="error">
        Products load nahi hue.<br>
        ${esc(error.message)}
      </p>
    `;

  }

}


/* =========================================================
   EDIT PRODUCT
   ========================================================= */

window.editProduct = function(product){

  $("pid").value =
    product.id || "";

  $("name").value =
    product.name || "";

  $("category").value =
    product.category || "";

  $("price").value =
    product.price ?? "";

  $("salePrice").value =
    product.salePrice ?? "";

  $("stock").value =
    product.stock ?? "";

  $("image").value =
    product.image || "";

  $("desc").value =
    product.description ||
    product.desc ||
    "";

  $("productMsg").textContent =
    "Edit mode: product details update karo.";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

};


/* =========================================================
   DELETE PRODUCT
   ========================================================= */

window.deleteProduct = async function(id){

  if(!confirm("Kya ye product delete karna hai?")){
    return;
  }

  try{

    await deleteDoc(
      doc(db, "products", id)
    );

    await loadProducts();

  }catch(error){

    alert(
      "Product delete nahi hua: " +
      error.message
    );

  }

};


/* =========================================================
   CLEAR PRODUCT FORM
   ========================================================= */

$("clearBtn").addEventListener("click", () => {

  [
    "pid",
    "name",
    "category",
    "price",
    "salePrice",
    "stock",
    "image",
    "desc"
  ].forEach(id => {
    $(id).value = "";
  });

  $("productMsg").textContent = "";

});


/* =========================================================
   SAVE PRODUCT
   ========================================================= */

$("saveBtn").addEventListener("click", async () => {

  const data = {

    name:
      $("name").value.trim(),

    category:
      $("category").value.trim(),

    price:
      Number($("price").value || 0),

    salePrice:
      Number($("salePrice").value || 0),

    stock:
      Number($("stock").value || 0),

    image:
      $("image").value.trim(),

    description:
      $("desc").value.trim()

  };

  if(!data.name){

    showProductMessage(
      "Product name required hai."
    );

    return;
  }

  if(data.price <= 0){

    showProductMessage(
      "Price 0 se greater hona chahiye."
    );

    return;
  }

  if(data.stock < 0){

    showProductMessage(
      "Stock negative nahi ho sakta."
    );

    return;
  }

  const saveBtn = $("saveBtn");

  saveBtn.disabled = true;
  saveBtn.textContent = "Saving...";

  try{

    const productId =
      $("pid").value.trim();

    if(productId){

      await updateDoc(
        doc(db, "products", productId),
        data
      );

      showProductMessage(
        "Product successfully updated.",
        true
      );

    }else{

      data.createdAt =
        serverTimestamp();

      await addDoc(
        collection(db, "products"),
        data
      );

      showProductMessage(
        "Product successfully added.",
        true
      );

    }

    $("clearBtn").click();

    await loadProducts();

  }catch(error){

    console.error(error);

    showProductMessage(
      "Product save nahi hua: " +
      error.message
    );

  }finally{

    saveBtn.disabled = false;
    saveBtn.textContent = "Save Product";

  }

});


/* =========================================================
   ORDERS
   ========================================================= */

async function loadOrders(){

  const container =
    $("orders");

  container.innerHTML =
    '<p class="muted">Loading orders...</p>';

  try{

    const q =
      query(
        collection(db, "orders"),
        orderBy("createdAt", "desc")
      );

    const snapshot =
      await getDocs(q);

    if(snapshot.empty){

      container.innerHTML =
        '<p class="muted">No orders yet.</p>';

      return;
    }

    container.innerHTML =
      snapshot.docs.map(docSnap => {

        const o =
          docSnap.data();

        const customerName =
          o.customerName ||
          o.name ||
          "Customer";

        const mobile =
          o.mobile ||
          "";

        const email =
          o.email ||
          "";

        const address =
          o.address ||
          "";

        const pincode =
          o.pincode ||
          "";

        const orderId =
          o.orderId ||
          docSnap.id;

        const total =
          Number(o.total || 0);

        const status =
          o.status ||
          "New";

        const payment =
          o.paymentMethod ||
          "Unknown";

        const paymentStatus =
          o.paymentStatus ||
          "";

        let itemsHtml =
          "";

        if(Array.isArray(o.items)){

          itemsHtml =
            o.items.map(item => `
              <div>
                ${esc(item.name || "Product")}
                × ${Number(item.qty || 1)}
                ${item.size ? " • Size " + esc(item.size) : ""}
                • ₹${Number(item.total || item.price || 0).toLocaleString("en-IN")}
              </div>
            `).join("");

        }else if(o.itemsText){

          itemsHtml =
            esc(o.itemsText);

        }else{

          itemsHtml =
            "Items details unavailable";

        }

        return `
          <div class="order">

            <h3>${esc(customerName)}</h3>

            <div>
              <b>Order ID:</b>
              ${esc(orderId)}
            </div>

            <div>
              <b>Mobile:</b>
              ${esc(mobile)}
            </div>

            ${
              email
              ? `<div><b>Email:</b> ${esc(email)}</div>`
              : ""
            }

            <div>
              <b>Address:</b>
              ${esc(address)}
              ${pincode ? " - " + esc(pincode) : ""}
            </div>

            <hr>

            <div>
              <b>Items:</b>
              <br>
              ${itemsHtml}
            </div>

            <br>

            <div>
              <b>Total:</b>
              ₹${total.toLocaleString("en-IN")}
            </div>

            <div>
              <b>Payment:</b>
              ${esc(payment)}
              ${paymentStatus ? " • " + esc(paymentStatus) : ""}
            </div>

            <div>
              <b>Status:</b>
              <span class="status">
                ${esc(status)}
              </span>
            </div>

            <div>
              <button
                class="btn"
                onclick="statusOrder('${esc(docSnap.id)}','Confirmed')"
              >
                Confirmed
              </button>

              <button
                class="btn"
                onclick="statusOrder('${esc(docSnap.id)}','Shipped')"
              >
                Shipped
              </button>

              <button
                class="btn"
                onclick="statusOrder('${esc(docSnap.id)}','Delivered')"
              >
                Delivered
              </button>

              <button
                class="btn danger"
                onclick="statusOrder('${esc(docSnap.id)}','Cancelled')"
              >
                Cancelled
              </button>
            </div>

          </div>
        `;

      }).join("");

  }catch(error){

    console.error(error);

    container.innerHTML = `
      <p class="error">
        Orders load nahi hue.<br>
        ${esc(error.message)}
      </p>
    `;

  }

}


/* =========================================================
   UPDATE ORDER STATUS
   ========================================================= */

window.statusOrder = async function(
  id,
  status
){

  try{

    await updateDoc(
      doc(db, "orders", id),
      {
        status: status,
        updatedAt: serverTimestamp()
      }
    );

    await loadOrders();

  }catch(error){

    alert(
      "Order status update nahi hua: " +
      error.message
    );

  }

};

</script>

</body>
</html>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* ================= FIREBASE ================= */

const firebaseConfig = {
  apiKey: "AIzaSyBQkq82HDMjndAPnvJ-yw64L3J55tFCHk",
  authDomain: "mens-fashion-hub-e2773.firebaseapp.com",
  projectId: "mens-fashion-hub-e2773",
  storageBucket: "mens-fashion-hub-e2773.firebasestorage.app",
  messagingSenderId: "309752221606",
  appId: "1:309752221606:web:9cd2ff5a64d9f25e5f8967",
  measurementId: "G-W99V4NZVK3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* ================= PRODUCTS ================= */

let products = [];

function escapeHTML(value) {

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* LOAD PRODUCTS */

async function loadProducts() {

  const box = document.getElementById("products");

  if (!box) return;

  box.innerHTML =
    '<p style="color:#aaa;font-size:18px;">Loading products...</p>';

  try {

    const snapshot =
      await getDocs(collection(db, "products"));

    products = [];

    snapshot.forEach((doc) => {

      products.push({
        id: doc.id,
        ...doc.data()
      });

    });

    console.log("MFH PRODUCTS:", products);

    renderProducts();

  } catch (error) {

    console.error("Firebase Product Error:", error);

    box.innerHTML = `
      <div style="
        background:#211;
        border:1px solid #733;
        padding:20px;
        border-radius:12px;
        color:#ff9999;
      ">
        Products load nahi ho rahe.<br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

  }

}


/* ================= RENDER ================= */

function renderProducts() {

  const box =
    document.getElementById("products");

  if (!box) return;


  const searchElement =
    document.getElementById("search");

  const categoryElement =
    document.getElementById("category");


  const search =
    searchElement
      ? searchElement.value.toLowerCase().trim()
      : "";


  const selectedCategory =
    categoryElement
      ? categoryElement.value
      : "";


  const filtered =
    products.filter((product) => {

      const name =
        String(product.name || "").toLowerCase();

      const category =
        String(
          product.category ||
          product.cat ||
          ""
        );


      const matchSearch =
        !search ||
        name.includes(search) ||
        category.toLowerCase().includes(search);


      const matchCategory =
        !selectedCategory ||
        category === selectedCategory;


      return matchSearch && matchCategory;

    });


  if (!filtered.length) {

    box.innerHTML = `
      <p style="
        color:#aaa;
        font-size:18px;
        padding:20px 0;
      ">
        No products found.
      </p>
    `;

    return;

  }


  box.innerHTML = filtered.map((product) => {

    const price =
      Number(
        product.salePrice ||
        product.price ||
        0
      );


    const oldPrice =
      Number(product.price || 0);


    const stock =
      Number(product.stock || 0);


    const image =
      product.image ||
      product.imageUrl ||
      "";


    const category =
      product.category ||
      "Fashion";


    return `

      <div class="card">

        <div class="pic">

          ${
            image

            ?

            `<img
              src="${escapeHTML(image)}"
              alt="${escapeHTML(product.name || "Product")}"
              style="
                width:100%;
                height:100%;
                object-fit:contain;
              "
              onerror="
                this.style.display='none';
              "
            >`

            :

            `👕`

          }

        </div>


        <div class="body">

          <div class="cat">
            ${escapeHTML(category)}
          </div>


          <h3>
            ${escapeHTML(product.name || "Product")}
          </h3>


          ${
            product.desc

            ?

            `<p style="
              color:#aaa;
              font-size:14px;
              line-height:1.5;
            ">
              ${escapeHTML(product.desc)}
            </p>`

            :

            ""

          }


          <div class="price">

            ₹${price.toLocaleString("en-IN")}

            ${
              oldPrice > price

              ?

              `<span class="old">
                ₹${oldPrice.toLocaleString("en-IN")}
              </span>`

              :

              ""

            }

          </div>


          <div class="stock">

            ${
              stock > 0

              ?

              `${stock} in stock`

              :

              `Out of stock`

            }

          </div>


          <br>


          <button
            class="btn"
            ${
              stock <= 0
              ? "disabled"
              : ""
            }

            onclick="addProduct(
              '${escapeHTML(product.id)}'
            )"
          >

            🛒 Add to Cart

          </button>

        </div>

      </div>

    `;

  }).join("");

}


/* ================= CART ================= */

let cart =
  JSON.parse(
    localStorage.getItem("mfh_cart_v2") || "[]"
  );


function saveCart() {

  localStorage.setItem(
    "mfh_cart_v2",
    JSON.stringify(cart)
  );

  updateCart();

}


window.addProduct = function(id) {

  const product =
    products.find(
      p => p.id === id
    );

  if (!product) {

    alert("Product nahi mila.");

    return;

  }


  const price =
    Number(
      product.salePrice ||
      product.price ||
      0
    );


  const existing =
    cart.find(
      item => item.id === id
    );


  if (existing) {

    existing.qty++;

  } else {

    cart.push({

      id: product.id,

      name: product.name,

      price: price,

      image:
        product.image ||
        product.imageUrl ||
        "",

      qty: 1

    });

  }


  saveCart();

  alert(
    product.name +
    " cart mein add ho gaya."
  );

};


function updateCart() {

  const count =
    cart.reduce(
      (total,item) =>
        total + item.qty,
      0
    );


  const cartCount =
    document.getElementById("cartCount");


  if (cartCount) {

    cartCount.textContent = count;

  }

}


/* ================= SEARCH ================= */

window.render =
  renderProducts;


window.loadProducts =
  loadProducts;


if (
  document.getElementById("search")
) {

  document
    .getElementById("search")
    .addEventListener(
      "input",
      renderProducts
    );

}


if (
  document.getElementById("category")
) {

  document
    .getElementById("category")
    .addEventListener(
      "change",
      renderProducts
    );

}


/* ================= START ================= */

updateCart();

loadProducts();

</script>

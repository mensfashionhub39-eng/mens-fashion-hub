<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Men's Fashion Hub | Store</title>
<meta name="description" content="Men's Fashion Hub — men's fashion, grooming, accessories and style essentials.">
<style>
:root{--bg:#080808;--card:#151515;--gold:#e0b52e;--white:#fff;--muted:#aaa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,sans-serif}
nav{padding:18px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929;position:sticky;top:0;background:#080808ee;backdrop-filter:blur(8px);z-index:5}
.logo{font-weight:800;letter-spacing:1px;color:var(--gold)}nav a{color:#fff;text-decoration:none;margin-left:16px}
.hero{text-align:center;padding:70px 20px 45px}.gold{color:var(--gold)}h1{font-size:clamp(38px,8vw,68px);margin:12px 0}.hero p{font-size:20px;color:#bbb}
.btn{display:inline-block;border:0;border-radius:12px;padding:14px 22px;background:var(--gold);color:#111;font-weight:800;text-decoration:none;cursor:pointer}
section{padding:25px 6%;max-width:1200px;margin:auto}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
input,select,textarea{background:#151515;color:#fff;border:1px solid #333;border-radius:10px;padding:13px;width:100%}
.toolbar input{flex:1;min-width:200px}.toolbar select{width:220px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:var(--card);border:1px solid #292929;border-radius:16px;overflow:hidden}
.card img{width:100%;height:250px;object-fit:cover;background:#222}.pad{padding:16px}.price{font-size:21px;font-weight:800;color:var(--gold)}.old{text-decoration:line-through;color:#777;font-size:14px;margin-left:8px}
.cart{position:fixed;right:18px;bottom:18px;background:var(--gold);color:#111;padding:15px 20px;border-radius:30px;font-weight:800;cursor:pointer;z-index:10}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;padding:20px;overflow:auto}.box{max-width:600px;margin:40px auto;background:#151515;border:1px solid #333;border-radius:18px;padding:22px}.close{float:right;background:none;color:#fff;border:0;font-size:25px;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;margin:10px 0}.row>*{flex:1}
footer{text-align:center;padding:40px;color:#777;border-top:1px solid #222;margin-top:40px}
@media(max-width:600px){nav{align-items:flex-start}.hero{padding-top:45px}.card img{height:220px}}
</style>
</head>
<body>
<nav><div class="logo">MFH • MEN'S FASHION HUB</div><div><a href="#store">Store</a><a href="#order">Order</a><a href="admin.html">Admin</a><a href="https://www.instagram.com/mens_fashionhub20/" target="_blank">Instagram</a></div></nav>

<div class="hero">
<div class="gold">MEN'S FASHION HUB</div>
<h1>LOOK GOOD. <span class="gold">FEEL CONFIDENT.</span></h1>
<p>Men's fashion • grooming • accessories</p>
<a class="btn" href="#store">Shop Now</a>
</div>

<section id="store">
<h2>🛍️ Store</h2>
<div class="toolbar">
<input id="search" placeholder="Search products..." oninput="render()">
<select id="cat" onchange="render()"><option value="">All categories</option></select>
</div>
<div id="products" class="grid"></div>
</section>

<div class="cart" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</div>

<div class="modal" id="cartModal">
<div class="box">
<button class="close" onclick="closeCart()">×</button>
<h2>Your Cart</h2>
<div id="cartItems"></div>
<hr>
<h3>Total: ₹<span id="total">0</span></h3>
<input id="custName" placeholder="Customer name">
<input id="custMobile" placeholder="Customer mobile number">
<textarea id="custAddress" rows="3" placeholder="Delivery address"></textarea>
<button class="btn" onclick="sendOrder()">Send Order on WhatsApp</button>
<p style="color:#888;font-size:12px">Orders are sent to the store WhatsApp number.</p>
</div></div>

<footer>© 2026 Men's Fashion Hub • Style. Confidence. You.</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
import { firebaseConfig, STORE_WHATSAPP } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let products=[], cart=[];

async function loadProducts(){
  try{
    const snap=await getDocs(query(collection(db,"products"),orderBy("createdAt","desc")));
    products=snap.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){
    console.error(e);
    document.getElementById("products").innerHTML='<p style="color:#aaa">Store is being connected. Please try again soon.</p>';
  }
  const cats=[...new Set(products.map(p=>p.category).filter(Boolean))];
  document.getElementById("cat").innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join("");
  render();
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
window.render=()=>{
  const q=document.getElementById("search").value.toLowerCase(), c=document.getElementById("cat").value;
  const list=products.filter(p=>(!q||String(p.name).toLowerCase().includes(q))&&(!c||p.category===c));
  document.getElementById("products").innerHTML=list.map(p=>{
    const sold=Number(p.stock||0)<=0;
    return `<div class="card"><img src="${esc(p.image||'https://via.placeholder.com/600x600?text=Men%27s+Fashion+Hub')}" alt="${esc(p.name)}">
    <div class="pad"><h3>${esc(p.name)}</h3><p>${esc(p.category||"")}</p>
    <div><span class="price">₹${Number(p.salePrice||p.price||0)}</span>${p.salePrice&&p.price?`<span class="old">₹${Number(p.price)}</span>`:""}</div>
    <p style="color:#aaa">Stock: ${Number(p.stock||0)}</p>
    <button class="btn" ${sold?"disabled":""} onclick="addToCart('${p.id}')">${sold?"Out of Stock":"Add to Cart"}</button></div></div>`;
  }).join("")||"<p>No products found.</p>";
};
window.addToCart=id=>{const p=products.find(x=>x.id===id);if(!p)return;const x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id,name:p.name,price:Number(p.salePrice||p.price||0),qty:1});updateCart();};
function updateCart(){document.getElementById("count").textContent=cart.reduce((a,b)=>a+b.qty,0);}
window.openCart=()=>{document.getElementById("cartModal").style.display="block";showCart();};
window.closeCart=()=>document.getElementById("cartModal").style.display="none";
function showCart(){let total=0;document.getElementById("cartItems").innerHTML=cart.map((x,i)=>{total+=x.price*x.qty;return `<div class="row"><div>${esc(x.name)} × ${x.qty}</div><div>₹${x.price*x.qty}</div><button onclick="removeItem(${i})">×</button></div>`}).join("")||"<p>Cart is empty.</p>";document.getElementById("total").textContent=total;}
window.removeItem=i=>{cart.splice(i,1);updateCart();showCart();};
window.sendOrder=()=>{
  if(!cart.length)return alert("Cart is empty.");
  const name=document.getElementById("custName").value.trim(), mobile=document.getElementById("custMobile").value.trim(), address=document.getElementById("custAddress").value.trim();
  if(!name||!mobile||!address)return alert("Please fill name, mobile and address.");
  let total=0, lines=cart.map(x=>{total+=x.price*x.qty;return `${x.name} x ${x.qty} = ₹${x.price*x.qty}`;});
  const msg=`NEW ORDER - Men's Fashion Hub\n\nName: ${name}\nMobile: ${mobile}\nAddress: ${address}\n\n${lines.join("\n")}\n\nTotal: ₹${total}`;
  location.href=`https://wa.me/${STORE_WHATSAPP}?text=${encodeURIComponent(msg)}`;
};
loadProducts();
</script>
</body>
</html>
